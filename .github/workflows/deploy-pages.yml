name: Deploy presentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - model-m-talk/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate presentation
        run: |
          rustc model-m-talk/tools/validate_deck.rs -o /tmp/validate-model-m-talk
          /tmp/validate-model-m-talk model-m-talk index.html slide-manifest.js
          /tmp/validate-model-m-talk model-m-talk archive/technical.html archive/slide-manifest-technical.js
          /tmp/validate-model-m-talk model-m-talk archive/index.html archive/slide-manifest-discovery.js

      - name: Upload presentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: model-m-talk

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
